name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The one test that drives a real browser skips itself here.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Hosted runners are several times slower than a desktop on the suites that write many files.
      TEST_TIMEOUT_MS: "180000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The suites stub Electron and block network access, so they need no
      # browser binary, no AI account and no macOS audio helper.
      - name: Test
        run: npm test

      # Compile the renderer and the Electron main/preload bundles.
      - name: Build (compile smoke test)
        run: npm run build:compile
